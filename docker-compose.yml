name: microservice
services:
  redis:
    image: redis:8.8-alpine3.23
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASS} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - microservice-network
